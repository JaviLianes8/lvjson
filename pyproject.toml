[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvjson"
version = "0.3.0"
description = "Read and write LabVIEW Flatten To JSON text: verified NaN/Infinity tokens, exact number formatting, strict portable mode"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["labview", "json", "nan", "infinity", "flatten-to-json", "ni"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine", "hatchling", "editables"]

[project.scripts]
lvjson = "lvjson._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/lvjson"
Issues = "https://github.com/JaviLianes8/lvjson/issues"
Changelog = "https://github.com/JaviLianes8/lvjson/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/lvjson"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
